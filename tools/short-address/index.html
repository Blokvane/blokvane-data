<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Blokvane party games</title>
<!-- A spare door. The short addresses are blokvane.com/tv and blokvane.com/play now: two doors in Blokvane's own
     server (server/app/web.py in blokvane-app) that open the pages at app.blokvane.com. This file does the same job
     for any plain file host: put it there as index.html, and that address opens the party games on a TV and Blokvane
     on a phone. -->
<style>
  html, body { margin: 0; min-height: 100%; background: #170f33; color: #f7f4ff; }
  body { min-height: 100vh; display: grid; place-items: center; font: 600 22px/1.4 system-ui, sans-serif; text-align: center; }
  a { color: #ffc93c; }
</style>
<script>
  // (a phone goes to Blokvane on the phone; anything bigger, like a TV or a computer, to the party games)
  (function () {
    var base = 'https://app.blokvane.com/';
    var phone = false;
    try { phone = Math.min(screen.width, screen.height) < 600 && (('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches)); } catch (e) {}
    location.replace(base + (phone ? 'go/' : 'play/') + (location.hash || ''));
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://app.blokvane.com/play/"></noscript>
</head>
<body>
<p>Opening Blokvane party games...<br><a href="https://app.blokvane.com/play/">Tap here if nothing happens</a></p>
</body>
</html>
