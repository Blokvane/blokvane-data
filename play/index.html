<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Blokvane party games</title>
<link rel="icon" href="../tv/icon.png">
<link rel="stylesheet" href="play.css?v=21">
<link rel="stylesheet" href="world.css?v=19">
<link rel="stylesheet" href="gir.css?v=15">
<link rel="stylesheet" href="imp.css?v=15">
<link rel="stylesheet" href="emoji.css?v=16">

<link rel="stylesheet" href="wlook.css?v=17">
<link rel="stylesheet" href="bwlook.css?v=19">
<!-- Blokvane party games: this page is the TV (or a laptop or tablet: any screen everyone can see). Players join from
     their phones by scanning the QR code: no app, no account. There is no Blokvane server: the phones and this page
     talk through free public relays, sealed and signed (../go/live-kit.js). Every game speaks seven languages fully
     (i18n.js and lang/). Trivia's questions are Blokvane's own, thousands in every language (q/). Guess It Right! is
     written in English and Arabic, with its own questions (gir-data.js), look (gir.css) and music (sounds/g-*.mp3).
     Who's the Imposter? has its own designed screens (imp-tpl.js), words in every language (imp-words.js), look (imp.css)
     and music (sounds/i-*.mp3). Emoji Riddles has its own designed screens (emoji-tpl.js), riddles with their answers in
     every language (emoji-data.js), look (emoji.css) and music (sounds/e-*.mp3). Where in the World? has its own lobby
     looks (wlook.css), winner screens (world-tpl.js) and music (sounds/wv-*.mp3). Boo Who? has its own designed
     screens (boowho-tpl.js), questions and Boo's lines in every language (bw/), look (bwlook.css) and music (sounds/bw-*.mp3). -->
</head>
<body>
<main id="stage" class="stage" aria-live="polite"></main>
<script>
// The scripts, in this order. A browser that can't read an async function (smart TVs from 2018 and 2019, like LG's with
// webOS 4) gets the copies of the ones that use them made for it: name.old.js beside name.js (tools/old-js.js).
(function () {
  var old = false;
  try { new Function('async function f() { await 0; }'); } catch (e) { old = true; }
  var hasOld = { 'wt-core': 1, 'wt-net': 1, 'live-kit': 1, 'i18n': 1, 'common': 1, 'sound': 1, 'play': 1, 'games': 1, 'boowho-game': 1, 'world-game': 1, 'gir-game': 1, 'imp-game': 1, 'emoji-game': 1 };
  var list = ['../go/compat.js?v=15',
    '../go/wt-core.js?v=15',
    '../go/wt-net.js?v=17',
    '../go/live-kit.js?v=17',
    '../go/qrcode.js?v=11',
    '../go/pass.js?v=1',
    'watch-boo.js?v=11',
    'i18n.js?v=21',
    'common.js?v=19',
    'sound.js?v=18',
    'packs.js?v=19',
    'map.js?v=15',
    'play.js?v=24',
    'q/index.js?v=12',
    'wheel.js?v=15',
    'games.js?v=19',
    'boowho-tpl.js?v=18',
    'boowho-game.js?v=19',
    'world-tpl.js?v=17',
    'world-game.js?v=19',
    'gir-game.js?v=17',
    'imp-tpl.js?v=15',
    'imp-words.js?v=14',
    'imp-game.js?v=17',
    'emoji-tpl.js?v=16',
    'emoji-game.js?v=17'];
  for (var i = 0; i < list.length; i++) {
    var src = list[i], name = src.split('?')[0].split('/').pop().replace(/\.js$/, '');
    if (old && hasOld[name]) src = src.replace(/\.js\?/, '.old.js?');
    document.write('<script src="' + src + '"><\/script>');
  }
})();
</script>
</body>
</html>
