# Blokvane's list robot: every hour it downloads the public block lists, checks them, puts them together into
# Blokvane's own list and publishes it on the "lists" branch, where the extension reads it. No one has to do anything.
# If a list fails its checks, the part published last time is kept and this run ends with an error (GitHub emails you).
name: Blokvane list

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['tools/build-lists.js', 'tools/lists/**', '.github/workflows/blokvane-list.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: blokvane-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # (each helper is named by its exact version, so a changed "v4" can never put other code in this robot)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Get the list published last time
        run: |
          mkdir -p "$RUNNER_TEMP/prev" "$RUNNER_TEMP/out"
          if git ls-remote --exit-code --heads origin lists >/dev/null 2>&1; then
            git fetch --depth 1 origin lists
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/prev"
          fi

      - name: Check the robot itself (made-up lists, nothing downloaded)
        run: node --test tools/test-lists.js

      - name: Build Blokvane's list
        run: node tools/build-lists.js --prev "$RUNNER_TEMP/prev" --out "$RUNNER_TEMP/out" --flag "$RUNNER_TEMP/changed"

      # (one commit that replaces the last one, so the repository does not grow with every update)
      - name: Publish it on the lists branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$RUNNER_TEMP/changed" ]; then echo "Nothing new to publish."; exit 0; fi
          cd "$RUNNER_TEMP/out"
          git init -q -b lists
          git config user.name "Blokvane list robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Blokvane's list, $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lists

      # The list's second home: Cloudflare Pages (lists.blokvane.com), which copies ask first, with GitHub as the backup.
      # It needs two settings in this repo (Settings, Secrets and variables, Actions): CLOUDFLARE_API_TOKEN (a key that
      # may only update Cloudflare Pages) and CLOUDFLARE_ACCOUNT_ID. Until they are there, this step does nothing.
      - name: Publish it on Cloudflare too
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Cloudflare is not set up yet: GitHub carries the list alone."; exit 0; fi
          if [ ! -f "$RUNNER_TEMP/changed" ]; then echo "Nothing new to publish."; exit 0; fi
          rm -rf "$RUNNER_TEMP/out/.git"
          npx --yes wrangler@4.152.0 pages deploy "$RUNNER_TEMP/out" --project-name blokvane-lists --branch main --commit-dirty=true

      # (GitHub switches a schedule off after 60 days without changes to the repository; this keeps it on)
      - name: Keep the schedule on
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/blokvane-list.yml/enable" >/dev/null 2>&1 || true
