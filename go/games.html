<!-- Blokvane Games: the party games' own small app (the same page as Blokvane on your phone, for games only). A
     game's QR code on the TV opens it; the first time, it asks: play here in the browser, or add the Games app to the
     home screen (and remembers). In the app: scan the QR code, type the code, or go back into the game you were in.
     Each game needs one Blokvane member as its host (pass.js); everyone else plays without signing in.
     Blokvane on your phone. What to do is after the # in the address (browsers never send that part anywhere). There
     is no Blokvane server behind this page: it talks to your devices through free public relays, sealed and signed
     (live-kit.js), and big things go straight between the two devices. -->
